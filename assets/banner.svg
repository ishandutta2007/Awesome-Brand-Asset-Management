<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Subtle Dynamic Animations in Background */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .bg-element-1 { animation: float1 8s ease-in-out infinite; }
    .bg-element-2 { animation: float2 10s ease-in-out infinite; }
    .pulse-circle { animation: pulseGlow 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->
  <g class="bg-element-1" opacity="0.4">
    <circle cx="150" cy="80" r="140" fill="#6366f1" filter="url(#glow)" class="pulse-circle" />
    <rect x="920" y="40" width="180" height="120" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="960" cy="80" r="16" fill="#38bdf8" opacity="0.8" />
    <rect x="990" y="70" width="80" height="8" rx="4" fill="#94a3b8" />
    <rect x="990" y="86" width="50" height="8" rx="4" fill="#64748b" />
  </g>

  <g class="bg-element-2" opacity="0.35">
    <circle cx="1050" cy="280" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-circle" />
    <rect x="80" y="200" width="160" height="100" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 100 270 L 130 240 L 160 255 L 210 220" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Decorative Grid Lines -->
  <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M200 0 V350 M400 0 V350 M600 0 V350 M800 0 V350 M1000 0 V350" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- FOREGROUND CONTENT CONTAINER (Ensures text & badges are strictly foreground) -->
  <g filter="url(#shadow)">
    <!-- Main Icon Graphic -->
    <g transform="translate(100, 95)">
      <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#titleGrad)" />
      <!-- Folder / Asset Icon -->
      <path d="M20 25 C20 22, 22 20, 25 20 L33 20 C35 20, 37 21, 38 23 L41 27 L50 27 C53 27, 55 29, 55 32 L55 48 C55 51, 53 53, 50 53 L25 53 C22 53, 20 51, 20 48 Z" fill="#0f172a" />
      <circle cx="43" cy="42" r="5" fill="#38bdf8" />
    </g>

    <!-- Header Title -->
    <text x="190" y="138" class="title">Awesome Brand Asset Management</text>

    <!-- Subtitle -->
    <text x="190" y="175" class="subtitle">Curated SaaS Platforms, Open-Source DAM &amp; Digital Brand Guidelines Ecosystem</text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(190, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="17" r="6" fill="#38bdf8" />
      <text x="36" y="22" class="badge-text">Digital Assets (DAM)</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="195" cy="17" r="6" fill="#818cf8" />
      <text x="211" y="22" class="badge-text">Brand Guidelines</text>

      <!-- Pill 3 -->
      <rect x="360" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="380" cy="17" r="6" fill="#c084fc" />
      <text x="396" y="22" class="badge-text">Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
